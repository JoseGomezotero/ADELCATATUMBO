<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto · ADEL Catatumbo</title>
<meta name="description" content="Contacta a la Agencia de Desarrollo Económico Local del Catatumbo en Ocaña, Norte de Santander.">
<link rel="icon" href="assets/img/favicon.png">
<script src="assets/js/analitica.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body data-pagina="contacto">
<div id="encabezado"></div>

<section class="banner">
  <div class="foto"><img src="https://images.unsplash.com/photo-1633627346972-0f3dfa551171?auto=format&fit=crop&w=2000&q=70" alt="" onerror="this.remove()"></div>
  <div class="rombo"></div>
  <div class="wrap">
    <div class="migas"><a href="index.html">Inicio</a> / Contacto</div>
    <span class="eyebrow">Contacto</span>
    <h1>Hablemos de desarrollo para el Catatumbo</h1>
    <p>¿Eres productor, organización, entidad pública, cooperante o empresa? Escríbenos y construyamos juntos.</p>
  </div>
</section>

<section>
  <div class="wrap contacto-grid">
    <div>
      <span class="eyebrow">Datos de contacto</span>
      <h2 class="h2">Visítanos o escríbenos</h2>
      <div style="margin-top:28px" id="datos"></div>
      <div style="height:280px;border-radius:18px;overflow:hidden;border:1px solid var(--linea);margin-top:10px">
        <iframe title="Ubicación sede ADEL Catatumbo" style="width:100%;height:100%;border:0" loading="lazy"
          src="https://www.google.com/maps?q=Calle+6+%2316-41,+Oca%C3%B1a,+Norte+de+Santander,+Colombia&z=16&output=embed"></iframe>
      </div>
    </div>
    <form class="f" onsubmit="return enviarContacto(event)">
      <h3 style="font-size:1.3rem">Envíanos un mensaje</h3>
      <div class="fila">
        <label>Nombre completo<input name="nombre" required placeholder="Tu nombre"></label>
        <label>Correo<input name="correo" type="email" required placeholder="tu@correo.com"></label>
      </div>
      <div class="fila">
        <label>Teléfono<input name="telefono" placeholder="300 000 0000"></label>
        <label>Municipio<input name="municipio" placeholder="Ej. Ocaña"></label>
      </div>
      <label>Soy<select name="tipo"><option>Productor/a</option><option>Organización de productores</option><option>Entidad pública</option><option>Cooperante</option><option>Empresa</option><option>Medio de comunicación</option><option>Otro</option></select></label>
      <label>Mensaje<textarea name="mensaje" required placeholder="¿En qué podemos ayudarte?"></textarea></label>
      <label class="check"><input type="checkbox" required> Autorizo el tratamiento de mis datos personales conforme a la Ley 1581 de 2012.</label>
      <button class="btn btn-teal" type="submit" style="justify-self:start">Enviar mensaje →</button>
    </form>
  </div>
</section>

<div id="pie"></div>
<script src="datos/convocatorias.js"></script>
<script src="datos/sitio.js"></script>
<script src="datos/paginas.js"></script>
<script src="datos/paginas-extra.js"></script>
<script src="assets/js/componentes.js"></script>
<script src="assets/js/carrito.js"></script>
<script>
document.getElementById("datos").innerHTML = `
  <div class="dato"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg></div><div><b>Entidad</b><span>${esc(SITIO.razon_social)} (ADEL Catatumbo) · NIT ${esc(SITIO.nit)}</span></div></div>
  <div class="dato"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 22c5-4 8-8 8-12a8 8 0 0 0-16 0c0 4 3 8 8 12z"/><circle cx="12" cy="10" r="3"/></svg></div><div><b>Dirección</b><span>${esc(SITIO.direccion)}</span></div></div>
  <div class="dato"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><div><b>Correo</b><a href="mailto:${correoVisible()}">${correoVisible()}</a></div></div>
  <div class="dato"><div class="ic"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div><div><b>Teléfono / WhatsApp</b><span>${SITIO.telefono}</span></div></div>
  <div class="dato"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div><b>Horario de atención</b><span>Lunes a viernes, 8:00 a.m. – 12:00 m. y 2:00 – 6:00 p.m.</span></div></div>`;
</script>
</body>
</html>
